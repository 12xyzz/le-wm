defaults:
  - _self_
  - data: pusht # CLI overrides: python train.py data=<name>
  - launcher: local

STABLEWM_HOME: "/scratch/u6gn/xuanya.u6gn/stablewm"
output_model_name: lewm-${data.preset}-curve
subdir: ${now:%m%d%H%M}_${oc.env:SLURM_JOB_ID,local}
run_dir: ${STABLEWM_HOME}/${data.preset}/${subdir}

num_workers: 6
train_split: 0.9
seed: 3072
img_size: 224
patch_size: 14
encoder_scale: tiny
dump_object: True

wandb:
  enabled: True
  config:
    name: ${output_model_name}
    id: ${subdir}
    save_dir: ${run_dir}

trainer:
  max_epochs: 10
  devices: auto
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0

loader:
  batch_size: 128
  num_workers: ${num_workers}
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3

wm:
  type: lewm
  history_size: 3
  num_preds: 1
  embed_dim: 192

predictor:
  depth: 6
  heads: 16
  mlp_dim: 2048
  dim_head: 64
  dropout: 0.1
  emb_dropout: 0.0

loss:
  sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024
  curve:
    enabled: true
    weight: 0.1
    step_thresh: 1e-6